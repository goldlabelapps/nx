<!-- @dsCard group="Components" viewport="700x460" name="Forms - Button, Input, Checkbox, Slider, Toggle" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--surface-page); padding: 28px; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 34px; max-width: 640px; }
  .lbl { font-family: var(--font-mono); font-size: 0.54rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--leida-muted); margin-bottom: 12px; display: block; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Button, Input, RangeSlider, SegmentedToggle, StarMark } = window.LeidaDesignSystem_ab1d28;

    function Toggle({ children, defaultPressed = false, disabled = false }) {
      const [pressed, setPressed] = React.useState(defaultPressed);
      return (
        <button
          type="button"
          aria-pressed={pressed}
          disabled={disabled}
          onClick={() => setPressed((current) => !current)}
          style={{
            display: "inline-flex",
            alignItems: "center",
            justifyContent: "center",
            gap: "9px",
            fontFamily: "var(--font-mono)",
            letterSpacing: "var(--track-button)",
            textTransform: "uppercase",
            borderRadius: "var(--radius-pill)",
            textDecoration: "none",
            cursor: disabled ? "not-allowed" : "pointer",
            opacity: disabled ? 0.45 : 1,
            transition: "transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), background var(--dur-fast)",
            padding: "10px 18px",
            fontSize: "0.95rem",
            background: pressed ? "var(--leida-ink)" : "rgba(255,255,255,0.4)",
            color: pressed ? "var(--leida-parchment)" : "var(--leida-ink)",
            border: pressed ? "1px solid transparent" : "1px solid var(--leida-line)",
            boxShadow: pressed ? "var(--shadow-button)" : "none",
            backdropFilter: pressed ? "none" : "var(--blur-chip)",
            WebkitBackdropFilter: pressed ? "none" : "var(--blur-chip)",
          }}
        >
          {children}
        </button>
      );
    }

    function Checkbox({ label, hint, defaultChecked = false, disabled = false }) {
      const [checked, setChecked] = React.useState(defaultChecked);
      return (
        <label style={{ display: "flex", gap: "12px", alignItems: "flex-start", opacity: disabled ? 0.84 : 1, cursor: disabled ? "not-allowed" : "pointer" }}>
          <span style={{ position: "relative", flex: "0 0 auto", width: "22px", height: "22px", borderRadius: "8px", border: "1px solid var(--border-input)", background: checked ? "linear-gradient(180deg, rgba(40, 34, 28, 0.98), rgba(23, 19, 16, 0.98))" : "var(--surface-input)", boxShadow: checked ? "var(--shadow-glass)" : "inset 0 1px 0 rgba(255,255,255,0.62)" }}>
            {checked ? <span aria-hidden="true" style={{ position: "absolute", left: "50%", top: "50%", transform: "translate(-50%, -57%) rotate(-45deg)", width: "10px", height: "5px", borderLeft: "2px solid var(--leida-parchment)", borderBottom: "2px solid var(--leida-parchment)" }} /> : null}
          </span>
          <span style={{ display: "grid", gap: "6px" }}>
            <span className="lbl" style={{ marginBottom: 0 }}>{label}</span>
            {hint ? <span style={{ fontFamily: "var(--font-mono)", fontSize: "0.78rem", letterSpacing: "0.04em", color: "var(--leida-muted)" }}>{hint}</span> : null}
          </span>
          <input type="checkbox" checked={checked} disabled={disabled} onChange={(event) => setChecked(event.target.checked)} style={{ position: "absolute", opacity: 0, pointerEvents: "none" }} />
        </label>
      );
    }
    function Demo() {
      const [tab, setTab] = React.useState("am");
      const [n, setN] = React.useState(30);
      return (
        <div className="wrap">
          <div style={{gridColumn:"1 / -1"}}>
            <span className="lbl">Buttons</span>
            <div className="row">
              <Button>Become a member</Button>
              <Button variant="ghost">How it works</Button>
              <Button variant="quiet" size="sm">Buy</Button>
              <Button disabled>Sold out</Button>
              <Button icon={<StarMark size={13} tone="offwhite" />}>Start</Button>
            </div>
          </div>
          <div>
            <span className="lbl">Input</span>
            <Input label="Email" type="email" placeholder="you@clinic.com" />
          </div>
          <div>
            <span className="lbl">Checkbox</span>
            <Checkbox label="Keep me signed in" hint="Use a private device if you turn this on." defaultChecked />
          </div>
          <div>
            <span className="lbl">Segmented toggle</span>
            <SegmentedToggle
              options={[{value:"am",label:"Morning"},{value:"pm",label:"Evening"}]}
              value={tab} onChange={setTab} />
          </div>
          <div>
            <span className="lbl">Toggle</span>
            <Toggle defaultPressed>Enable reminders</Toggle>
          </div>
          <div style={{gridColumn:"1 / -1"}}>
            <span className="lbl">Range slider</span>
            <RangeSlider label="Clients / week" min={5} max={80} value={n}
              onChange={setN} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
